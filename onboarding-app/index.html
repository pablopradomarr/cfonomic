const TOTAL=TEMPLATE.reduce((n,c)=>n+c.cards.length,0);
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'');
const email=u=>norm(u)+'@login.cfonomic.invalid';
let session=null,user=null,role=null,currentOrg=null,answers={},statuses={},reviews={},timers={};
function nav(label=''){return `<div class="nav"><div class="brand">CFOnomic<b>.</b></div><span class="muted">${esc(label)}</span><div class="spacer"></div><button class="btn" id="homeBtn">${role==='client'?'Mi tablero':'Clientes'}</button><button class="btn" id="logoutBtn">Salir</button></div>`}
function bindNav(){document.getElementById('logoutBtn')?.addEventListener('click',async()=>{await supabase.auth.signOut();location.href=location.pathname});document.getElementById('homeBtn')?.addEventListener('click',()=>{role==='client'?loadClient():loadStaff()})}
function loginView(msg=''){app.innerHTML=`<main class="login"><section class="panel"><div class="brand">CFOnomic<b>.</b></div><p class="eyebrow">Onboarding financiero</p><h1>Acceso</h1><p class="muted">La información se guarda y sincroniza en el servidor. No introduzcas contraseñas bancarias ni claves de otros sistemas.</p>${msg?`<div class="msg err">${esc(msg)}</div>`:''}<form id="login"><label>Usuario<input name="username" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary">Entrar</button></form></section></main>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.currentTarget);let r=await supabase.auth.signInWithPassword({email:email(f.get('username')),password:String(f.get('password'))});if(r.error)return loginView('Usuario o contraseña incorrectos.');await start()}}
async function inviteView(token){app.innerHTML=`<main class="login"><section class="panel"><div class="brand">CFOnomic<b>.</b></div><p class="eyebrow">Alta de cliente</p><h1>Crea tu acceso</h1><p class="muted">Elige tu usuario y contraseña. Este enlace es de un solo uso.</p><div id="inviteMsg"></div><form id="inviteForm"><label>Nombre<input name="fullName" required></label><label>Usuario<input name="username" required minlength="3"></label><label>Contraseña<input name="password" type="password" required minlength="14" placeholder="Mínimo 14 caracteres"></label><button class="btn primary">Crear acceso</button></form></section></main>`;document.getElementById('inviteForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const username=norm(f.get('username'));const password=String(f.get('password'));const res=await fetch(SUPABASE_URL+'/functions/v1/register-invite',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({token,fullName:String(f.get('fullName')),username,password})});const d=await res.json();if(!res.ok){document.getElementById('inviteMsg').innerHTML='<div class="msg err">'+esc(d.error||'No se pudo crear el acceso')+'</div>';return}const si=await supabase.auth.signInWithPassword({email:email(username),password});if(si.error) return loginView('Cuenta creada. Entra con tu usuario y contraseña.');history.replaceState(null,'','/');await start()}}
async function edgeAdmin(body){const {data:{session:s}}=await supabase.auth.getSession();const r=await fetch(SUPABASE_URL+'/functions/v1/admin-ops',{method:'POST',headers:{'content-type':'application/json','apikey':SUPABASE_KEY,'authorization':'Bearer '+s.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d}
async function start(){const params=new URLSearchParams(location.search);if(params.get('invite'))return inviteView(params.get('invite'));const ss=await supabase.auth.getSession();session=ss.data.session;if(!session)return loginView();user=session.user;role=user.app_metadata?.role||'client';role==='client'?await loadClient():await loadStaff()}
async function loadClient(){const m=await supabase.from('organization_members').select('organization_id,organizations(id,name,slug)').eq('user_id',user.id).limit(1);const org=m.data?.[0]?.organizations;if(!org){app.innerHTML=nav('Sin empresa')+'<div class="shell"><div class="msg err">No hay empresa asignada.</div></div>';bindNav();return}await loadBoard(org,'client')}
async function loadStaff(){const [o,s,r]=await Promise.all([supabase.from('organizations').select('id,name,slug,created_at').order('created_at',{ascending:false}),supabase.from('onboarding_card_status').select('organization_id,state,updated_at'),supabase.from('onboarding_admin_review').select('organization_id,review_state')]);const orgs=o.data||[], sts=s.data||[], rev=r.data||[];app.innerHTML=nav(role==='admin'?'Panel CFOnomic · Admin':'Panel CFOnomic · Empleado')+`<main class="shell"><div class="head"><div><p class="eyebrow">CFOnomic · Clientes</p><h1>Onboarding activo</h1><p class="muted">${role==='employee'?'Acceso de lectura a todos los clientes.':'Gestiona clientes, invitaciones y progreso.'}</p></div></div><div class="admin-grid"><section class="client-list" id="clientList"></section>${role==='admin'?`<aside class="side"><h2>Nuevo cliente</h2><p class="muted">El cliente elegirá su usuario y contraseña.</p><div id="adminMsg"></div><form id="clientForm"><label>Empresa<input name="companyName" required></label><label>Persona de contacto<input name="contactName"></label><label>Identificador<input name="slug" placeholder="fierro-fernandez"></label><button class="btn primary">Crear invitación</button></form><hr><h2>Nuevo empleado</h2><form id="empForm"><label>Nombre<input name="fullName" required></label><label>Usuario<input name="username" required></label><label>Contraseña inicial<input name="password" type="password" minlength="14" required></label><button class="btn">Crear empleado</button></form></aside>`:''}</div></main>`;bindNav();const list=document.getElementById('clientList');orgs.forEach(org=>{const ss=sts.filter(x=>x.organization_id===org.id),done=ss.filter(x=>['Completo','No aplica'].includes(x.state)).length,pct=Math.round(done/TOTAL*100),val=rev.filter(x=>x.organization_id===org.id&&x.review_state==='Validado').length;const el=document.createElement('div');el.className='client-row';el.innerHTML=`<div><strong>${esc(org.name)}</strong><div class="muted">@${esc(org.slug)}</div></div><div class="progress"><i style="width:${pct}%"></i></div><b>${pct}%</b><span>✓ ${val}</span>`;el.onclick=()=>loadBoard(org,role);list.appendChild(el)});if(role==='admin'){document.getElementById('clientForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{const d=await edgeAdmin({action:'create_client_invite',companyName:String(f.get('companyName')),contactName:String(f.get('contactName')),slug:String(f.get('slug'))});const link=location.origin+location.pathname+'?invite='+encodeURIComponent(d.token);document.getElementById('adminMsg').innerHTML=`<div class="msg ok"><strong>Invitación creada</strong><code>${esc(link)}</code><p class="muted">Copia este enlace antes de salir de esta pantalla.</p></div>`}catch(err){document.getElementById('adminMsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'}};document.getElementById('empForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await edgeAdmin({action:'create_employee',fullName:String(f.get('fullName')),username:norm(f.get('username')),password:String(f.get('password'))});alert('Empleado creado');e.currentTarget.reset()}catch(err){alert(err.message)}}}}
async function loadBoard(org,mode){currentOrg=org;const [a,s,r]=await Promise.all([supabase.from('onboarding_answers').select('card_key,field_key,value').eq('organization_id',org.id),supabase.from('onboarding_card_status').select('card_key,state').eq('organization_id',org.id),supabase.from('onboarding_admin_review').select('card_key,review_state,note').eq('organization_id',org.id)]);answers=Object.fromEntries((a.data||[]).map(x=>[x.card_key+'::'+x.field_key,x.value]));statuses=Object.fromEntries((s.data||[]).map(x=>[x.card_key,x.state]));reviews=Object.fromEntries((r.data||[]).map(x=>[x.card_key,x]));renderBoard(org,mode);if(mode!=='client')subscribe(org,mode)}
let channel=null;function subscribe(org,mode){if(channel)supabase.removeChannel(channel);channel=supabase.channel('org:'+org.id).on('postgres_changes',{event:'*',schema:'public',table:'onboarding_answers',filter:'organization_id=eq.'+org.id},()=>loadBoard(org,mode)).on('postgres_changes',{event:'*',schema:'public',table:'onboarding_card_status',filter:'organization_id=eq.'+org.id},()=>loadBoard(org,mode)).on('postgres_changes',{event:'*',schema:'public',table:'onboarding_admin_review',filter:'organization_id=eq.'+org.id},()=>loadBoard(org,mode)).subscribe()}
function renderBoard(org,mode){const done=Object.values(statuses).filter(x=>['Completo','No aplica'].includes(x)).length,pct=Math.round(done/TOTAL*100),readonly=mode==='employee';app.innerHTML=nav(org.name)+`<main class="shell"><div class="head"><div><p class="eyebrow">${esc(org.name)} · Onboarding CFOnomic</p><h1>Mapa de arranque</h1><p class="muted">Primero entendemos cómo funciona la empresa; después estructuramos datos, procesos y ERP.</p></div><div class="save" id="save">Guardado</div></div><div class="toolbar"><div class="progress"><i style="width:${pct}%"></i></div><strong>${pct}% · ${done}/${TOTAL}</strong></div><div class="board-wrap"><div class="board" id="board"></div></div></main>`;bindNav();const board=document.getElementById('board');TEMPLATE.forEach((col,ci)=>{const sec=document.createElement('section');sec.className='col';sec.innerHTML=`<div class="colhead"><span class="num">${String(ci+1).padStart(2,'0')}</span><div><h2>${esc(col.title)}</h2><p>${esc(col.description)}</p></div></div>`;col.cards.forEach(card=>{const state=statuses[card.key]||'Pendiente',rev=reviews[card.key]?.review_state||'Sin revisar';const art=document.createElement('article');art.className='card '+(state==='Completo'?'complete':'');art.innerHTML=`<button class="cardhead"><div class="kicker"><span class="pill">${esc(card.priority)}</span><span>${esc(state)}</span>${mode!=='client'?`<span>${esc(rev)}</span>`:''}</div><h3>${esc(card.title)}</h3><p>${esc(card.description)}</p></button><div class="body hidden"></div>`;const head=art.querySelector('.cardhead'),body=art.querySelector('.body');head.onclick=()=>{body.classList.toggle('hidden');if(!body.dataset.built){buildCardBody(body,card,mode,readonly);body.dataset.built='1'}};sec.appendChild(art)});board.appendChild(sec)})}
function setSave(s){const el=document.getElementById('save');if(!el)return;el.textContent=s==='saving'?'Guardando…':s==='error'?'Error al guardar':'Guardado';el.className='save '+s}
async function saveAnswer(card,field,value){setSave('saving');const r=await supabase.from('onboarding_answers').upsert({organization_id:currentOrg.id,card_key:card,field_key:field,value},{onConflict:'organization_id,card_key,field_key'});setSave(r.error?'error':'saved')}
function buildCardBody(body,card,mode,readonly){body.innerHTML=`<div class="statusrow"><label>Estado<select class="state" ${readonly?'disabled':''}>${['Pendiente','En curso','Completo','No aplica'].map(x=>`<option ${x===(statuses[card.key]||'Pendiente')?'selected':''}>${x}</option>`).join('')}</select></label>${mode==='admin'?`<label>Revisión<select class="review">${['Sin revisar','Validado','Falta información'].map(x=>`<option ${x===(reviews[card.key]?.review_state||'Sin revisar')?'selected':''}>${x}</option>`).join('')}</select></label>`:''}</div><div class="fields"></div>`;const fields=body.querySelector('.fields');card.fields.forEach(f=>{const lab=document.createElement('label');lab.innerHTML=`<span>${esc(f.label)}</span><textarea ${readonly?'readonly':''} placeholder="${esc(f.placeholder)}">${esc(answers[card.key+'::'+f.key]??'')}</textarea>`;const ta=lab.querySelector('textarea');if(!readonly)ta.oninput=()=>{clearTimeout(timers[card.key+'::'+f.key]);timers[card.key+'::'+f.key]=setTimeout(()=>saveAnswer(card.key,f.key,ta.value),500)};fields.appendChild(lab)});card.checks.forEach(c=>{const lab=document.createElement('label');lab.className='check';const checked=Boolean(answers[card.key+'::'+c.key]);lab.innerHTML=`<input type="checkbox" ${checked?'checked':''} ${readonly?'disabled':''}><span>${esc(c.label)}</span>`;const cb=lab.querySelector('input');if(!readonly)cb.onchange=()=>saveAnswer(card.key,c.key,cb.checked);fields.appendChild(lab)});const st=body.querySelector('.state');if(st&&!readonly)st.onchange=async()=>{statuses[card.key]=st.value;setSave('saving');const r=await supabase.from('onboarding_card_status').upsert({organization_id:currentOrg.id,card_key:card.key,state:st.value},{onConflict:'organization_id,card_key'});setSave(r.error?'error':'saved')};if(mode==='admin'){const rv=body.querySelector('.review');rv.onchange=async()=>{const note=reviews[card.key]?.note||'';reviews[card.key]={card_key:card.key,review_state:rv.value,note};await supabase.from('onboarding_admin_review').upsert({organization_id:currentOrg.id,card_key:card.key,review_state:rv.value,note},{onConflict:'organization_id,card_key'})};const lab=document.createElement('label');lab.innerHTML=`<span>Nota de revisión CFOnomic</span><textarea placeholder="Qué falta, qué validar…">${esc(reviews[card.key]?.note||'')}</textarea>`;const ta=lab.querySelector('textarea');ta.oninput=()=>{clearTimeout(timers['review::'+card.key]);timers['review::'+card.key]=setTimeout(async()=>{const rs=reviews[card.key]?.review_state||'Sin revisar';await supabase.from('onboarding_admin_review').upsert({organization_id:currentOrg.id,card_key:card.key,review_state:rs,note:ta.value},{onConflict:'organization_id,card_key'})},500)};fields.appendChild(lab)}}
start();
</script></body></html>
